<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>審稿註記板｜美地居家收納 Stitch 版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Serif+TC:wght@600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .review-board { width: min(1500px, calc(100% - 48px)); margin: 0 auto; padding: 72px 0; }
      .review-card { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; padding: 24px 0; border-top: 1px solid rgba(5, 25, 14, 0.12); }
      .review-frame { height: 720px; border: 1px solid rgba(74, 97, 82, 0.24); border-radius: 14px; overflow: hidden; background: #fff; box-shadow: var(--shadow); }
      .review-frame iframe { width: 100%; height: 100%; border: 0; background: #fff; }
      .review-notes { position: sticky; top: 96px; align-self: start; display: grid; gap: 14px; }
      .review-notes textarea { width: 100%; min-height: 220px; resize: vertical; border: 1px solid var(--outline-soft); border-radius: 10px; padding: 14px; background: rgba(255,255,255,.78); color: var(--text); font: inherit; }
      .review-checklist { display: grid; gap: 8px; color: var(--muted); }
      .review-checklist label { display: flex; gap: 8px; align-items: start; }
      @media (max-width: 980px) {
        .review-card { grid-template-columns: 1fr; }
        .review-frame { height: 620px; }
        .review-notes { position: static; }
      }
    </style>
  </head>
  <body class="grid-bg">
    <nav class="nav"><div class="nav-inner"><a class="brand" href="index.html"><img src="assets/meidi-logo.png" alt="美地居家收納 logo" /><span class="brand-name">美地居家收納</span></a><div class="nav-links"><a href="index.html">首頁</a><a href="about.html">關於美地</a><a href="team.html">收納團隊</a><a href="services.html">服務項目</a><a href="portfolio.html">精選案例</a><a href="booking.html">預約聯繫</a></div><a class="button" href="booking.html">線上預約</a></div></nav>
    <main class="review-board">
      <header class="page-hero"><span class="label">審稿註記板</span><h1>逐頁標記需要修改的位置。</h1><p class="lede">此頁供內部與客戶審稿使用，不放在主選單。可在每個頁面旁輸入調整意見，再截圖或列印成 PDF 回傳。</p></header>
      <section class="review-card">
        <div class="review-frame"><iframe title="首頁預覽" src="index.html"></iframe></div>
        <aside class="review-notes"><span class="label">01 / 首頁</span><h3>首頁</h3><textarea placeholder="請標註 Hero、空間分類、核心導流區塊需要調整的文字、照片或順序。"></textarea><div class="review-checklist"><label><input type="checkbox" /> 首屏主張清楚</label><label><input type="checkbox" /> 空間分類符合服務範圍</label><label><input type="checkbox" /> 預約 CTA 位置明確</label></div></aside>
      </section>
      <section class="review-card">
        <div class="review-frame"><iframe title="關於美地預覽" src="about.html"></iframe></div>
        <aside class="review-notes"><span class="label">02 / 關於美地</span><h3>關於美地</h3><textarea placeholder="請標註品牌故事、方法論、納爺體系說明是否需要增刪。"></textarea><div class="review-checklist"><label><input type="checkbox" /> 品牌初衷完整</label><label><input type="checkbox" /> 方法論易懂</label><label><input type="checkbox" /> 沒有與團隊頁重複</label></div></aside>
      </section>
      <section class="review-card">
        <div class="review-frame"><iframe title="收納團隊預覽" src="team.html"></iframe></div>
        <aside class="review-notes"><span class="label">03 / 收納團隊</span><h3>收納團隊</h3><textarea placeholder="請標註資歷、社群、動態牆、形象照與培訓照是否需要替換。"></textarea><div class="review-checklist"><label><input type="checkbox" /> 專業背書足夠</label><label><input type="checkbox" /> 社群入口清楚</label><label><input type="checkbox" /> 圖片使用已確認</label></div></aside>
      </section>
      <section class="review-card">
        <div class="review-frame"><iframe title="服務項目預覽" src="services.html"></iframe></div>
        <aside class="review-notes"><span class="label">04 / 服務項目</span><h3>服務項目</h3><textarea placeholder="請標註六大分類、服務範圍、報價導引是否需要調整。"></textarea><div class="review-checklist"><label><input type="checkbox" /> 分類名稱正確</label><label><input type="checkbox" /> 服務描述貼近客戶</label><label><input type="checkbox" /> 報價導引清楚</label></div></aside>
      </section>
      <section class="review-card">
        <div class="review-frame"><iframe title="精選案例預覽" src="portfolio.html"></iframe></div>
        <aside class="review-notes"><span class="label">05 / 精選案例</span><h3>精選案例</h3><textarea placeholder="請標註案例分類、待補照片、文字方向與隱私提醒。"></textarea><div class="review-checklist"><label><input type="checkbox" /> 案例分類可用</label><label><input type="checkbox" /> 待補圖說清楚</label><label><input type="checkbox" /> 隱私說明合適</label></div></aside>
      </section>
      <section class="review-card">
        <div class="review-frame"><iframe title="預約聯繫預覽" src="booking.html"></iframe></div>
        <aside class="review-notes"><span class="label">06 / 預約聯繫</span><h3>預約聯繫</h3><textarea placeholder="請標註流程、費用、表單欄位、LINE 或 Facebook 導向是否需要修改。"></textarea><div class="review-checklist"><label><input type="checkbox" /> 三步驟流程清楚</label><label><input type="checkbox" /> 報價資訊正確</label><label><input type="checkbox" /> 聯繫 CTA 待補正式 LINE</label></div></aside>
      </section>
    </main>
    <footer><div class="footer-inner"><div>美地居家收納 · 審稿註記板</div><div><a href="index.html">回網站首頁</a></div></div></footer>
  </body>
</html>
